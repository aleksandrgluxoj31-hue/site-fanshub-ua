<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель автора - FansHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-wrapper" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
        <!-- Нова помітна кнопка повернення -->
        <a href="index.html" class="nav-link">← На головну сторінку</a>

        <h1 style="margin-bottom: 30px; font-size: 28px;">Вітаємо в кабінеті автора, Катерино! 👋</h1>

        <div class="stats-grid" style="display: flex; gap: 20px; margin-bottom: 40px;">
            <div class="stat-card" style="flex: 1; padding: 20px; border-radius: 12px;">
                <p style="margin: 0; font-size: 13px; font-weight: 600;" class="stat-label">БАЛАНС ДО ВИВЕДЕННЯ</p>
                <h2 style="margin: 10px 0 0 0; font-size: 32px; color: #4caf50;">$1,450.00</h2>
            </div>
            <div class="stat-card" style="flex: 1; padding: 20px; border-radius: 12px;">
                <p style="margin: 0; font-size: 13px; font-weight: 600;" class="stat-label">АКТИВНІ ПІДПИСНИКИ</p>
                <h2 style="margin: 10px 0 0 0; font-size: 32px; color: #00aff0;">482 клієнти</h2>
            </div>
            <div class="stat-card" style="flex: 1; padding: 20px; border-radius: 12px;">
                <p style="margin: 0; font-size: 13px; font-weight: 600;" class="stat-label">ЗАРОБІТОК З PPV ЧАТУ</p>
                <h2 style="margin: 10px 0 0 0; font-size: 32px; color: #e91e63;">$890.50</h2>
            </div>
        </div>

        <div class="dashboard-main-content" style="display: flex; gap: 30px;">
            <div class="upload-section" style="flex: 1; padding: 30px; border-radius: 12px;">
                <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px;">🔥 Опублікувати новий ексклюзив</h3>
                <form onsubmit="event.preventDefault(); alert('Контент успішно відправлено на модерацію!')">
                    <div class="input-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Опис поста:</label>
                        <textarea placeholder="Напишіть щось гаряче для своїх фанатів..." style="width: 100%; height: 100px; padding: 12px; border: 1px solid #d8e1e6; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 14px;"></textarea>
                    </div>
                    <div class="input-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Оберіть файл:</label>
                        <input type="file" accept="image/*,video/*" style="width: 100%; padding: 10px; border: 1px solid #d8e1e6; border-radius: 6px; box-sizing: border-box;">
                    </div>
                    <div class="input-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Тип доступу:</label>
                        <select style="width: 100%; padding: 12px; border: 1px solid #d8e1e6; border-radius: 6px; font-size: 14px;">
                            <option>Безкоштовно</option>
                            <option>Платне повідомлення (PPV) — $3.50</option>
                            <option>Тільки для VIP-рівня</option>
                        </select>
                    </div>
                    <button type="submit" class="primary-btn" style="margin-bottom: 0;">ОПУБЛІКУВАТИ КОНТЕНТ 🚀</button>
                </form>
            </div>

            <div class="payout-section" style="width: 350px; padding: 30px; border-radius: 12px; height: fit-content;">
                <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px;">💸 Виведення заробітку</h3>
                <form onsubmit="event.preventDefault(); alert('Заявку створено!')">
                    <div class="input-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Платіжний метод:</label>
                        <select style="width: 100%; padding: 12px; border: 1px solid #d8e1e6; border-radius: 6px; font-size: 14px;">
                            <option>Криптовалюта USDT (TRC-20)</option>
                            <option>Paxum</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Адреса гаманця:</label>
                        <input type="text" placeholder="TX7xx..." required style="width: 100%; padding: 12px; border: 1px solid #d8e1e6; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                    <div class="input-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Сума ($):</label>
                        <input type="number" min="50" max="1450" placeholder="Мінімум $50" required style="width: 100%; padding: 12px; border: 1px solid #d8e1e6; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                    <button type="submit" class="primary-btn" style="background-color: #4caf50; margin-bottom: 0;">ЗАПРОСИТИ ВИПЛАТУ 💰</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
